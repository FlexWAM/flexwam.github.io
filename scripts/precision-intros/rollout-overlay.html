<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Randomized precision test annotations</title>
  <style>
    @font-face {
      font-family: Noto;
      src: url("../../public/fonts/noto-sans-latin.woff2");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      background: transparent;
      color: white;
      font-family: Noto, sans-serif;
    }
    .status {
      position: absolute;
      left: 32px;
      top: 32px;
      width: max-content;
      padding: 8px 12px;
      background: #071820eb;
      border-left: 3px solid #7edcd5;
      font-size: 32px;
      font-weight: 650;
      line-height: 1.3;
    }
    .success {
      color: #8fe8ca;
    }
    .reset {
      position: absolute;
      left: 32px;
      top: 102px;
      padding: 8px 12px;
      background: #071820eb;
      color: #f3dca9;
      font-size: 26px;
      border-left: 3px solid #d7bb7a;
    }
    .caption {
      position: absolute;
      inset: auto 0 0;
      height: 180px;
      padding: 62px 48px 25px;
      background: linear-gradient(transparent, #061219b8);
    }
    .task {
      font-size: 46px;
      font-weight: 650;
      text-shadow: 0 2px 8px #0008;
    }
    .metric {
      margin-top: 6px;
      color: #83dfe2;
      font-size: 31px;
      font-weight: 550;
    }
  </style>
  <div class="status">
    <span id="status"></span>
  </div>
  <div class="reset" hidden>Reset · Randomly repositioning the target</div>
  <div class="caption">
    <div class="task"></div>
    <div class="metric"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const cable = params.get("task") === "cable";
    const count = Number(params.get("count")) || 1;
    const state = params.get("state") || "trial";
    const successful = state !== "trial";
    const ordinal = `${count}${count === 1 ? "st" : count === 2 ? "nd" : count === 3 ? "rd" : "th"}`;
    document.querySelector("#status").textContent = successful
      ? `${ordinal} successful insertion`
      : `Trial ${count}`;
    document.querySelector("#status").classList.toggle("success", successful);
    document.querySelector(".reset").hidden = state !== "reset";
    document.querySelector(".task").textContent = cable
      ? "Ethernet cable insertion"
      : params.get("task") === "peg-round"
        ? "Round Peg-in-Hole"
        : "L-shaped Peg-in-Hole";
    document.querySelector(".metric").textContent = cable
      ? "Approx. ±0.1 mm / ≤1° alignment tolerance"
      : `${params.get("task") === "peg-round" ? "Round" : "L-shaped"} · 0.02 mm clearance`;
  </script>
</html>
