<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Consecutive success annotation</title>
  <style>
    @font-face {
      font-family: Noto;
      src: url("../../public/fonts/noto-sans-latin.woff2");
      font-weight: 100 900;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 860px;
      height: 140px;
      margin: 0;
      background: transparent;
    }
    .badge {
      display: flex;
      gap: 28px;
      align-items: center;
      height: 140px;
      padding: 20px 30px;
      border-radius: 16px;
      background: #14232be6;
      color: white;
      font-family: Noto, sans-serif;
      border-left: 6px solid #78e4bf;
    }
    .count {
      font-size: 82px;
      font-weight: 750;
      line-height: 1;
      color: #8fe8ca;
      letter-spacing: -0.06em;
    }
    .eyebrow {
      font-size: 21px;
      letter-spacing: 0.15em;
      color: #b7cbd0;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .label {
      font-size: 43px;
      line-height: 1.3;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
  </style>
  <div class="badge">
    <div class="count" id="count"></div>
    <div>
      <div class="eyebrow">SUCCESS STREAK</div>
      <div class="label" id="label"></div>
    </div>
  </div>
  <script>
    const count =
      Number(new URLSearchParams(location.search).get("count")) || 1;
    document.querySelector("#count").textContent = String(count).padStart(
      2,
      "0",
    );
    document.querySelector("#label").textContent = [
      "First success",
      "2nd consecutive success",
      "3rd consecutive success",
    ][count - 1];
  </script>
</html>
